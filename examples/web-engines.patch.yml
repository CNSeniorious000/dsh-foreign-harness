- id: agent-loop
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      mint-alpha:
        api: anthropic-messages
        baseURL: https://mint-alpha.macaron.xin
        apiKeyEnv: MINT_ALPHA_API_KEY
        models:
          - id: deepseek-flash

- id: agent-default-model
  config:
    provider: mint-alpha
    model: deepseek-flash

- insert:
    - id: cc-agent-loop
      name: dsh-cc-agent-loop

    # 引擎选择：模式选择器里的另外两项。config.id 就是引擎名（harness.js 的 ENGINES）。
    # 这两个 preset 只是标签：引擎用自己的系统提示词，dsh 不做任何注入。
    - id: preset-cc-claude
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: claude-code
        name: Claude Code
        description: 由本机 Claude Code 驱动；工具调用显示为 dsh 原生卡片。
        order: 5
        plugins: []

    - id: preset-cc-codex
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: codex
        name: Codex
        description: 由本机 Codex CLI 驱动；工具调用显示为 dsh 原生卡片。
        order: 6
        plugins: []
